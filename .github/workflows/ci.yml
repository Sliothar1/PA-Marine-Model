name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Fixture pipeline
        run: python scripts/run_pipeline.py --fixture
      - name: Live ERDDAP probe
        run: python -m pa_marine.cli probe
        continue-on-error: true
