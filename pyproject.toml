[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-marine"
version = "0.1.0"
description = "Irish HAB exceedance nowcast/forecast from SST and marine-heatwave features"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0", "xgboost>=2.0"]
uk = ["pyproj>=3.6"]
ostia = ["copernicusmarine>=2.0", "xarray>=2024.1", "netCDF4>=1.6"]
dev = ["pytest>=7.0", "pyproj>=3.6"]

[project.scripts]
pa-marine = "pa_marine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
