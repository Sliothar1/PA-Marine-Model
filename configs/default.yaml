domain:
  lat_min: 51.0
  lat_max: 56.0
  lon_min: -11.0
  lon_max: -5.0

hab:
  erddap_base: https://erddap3.marine.ie/erddap
  dataset_id: habs_phyto
  # Verified 2026-09-01 via info.json / tabledap CSV:
  # scientific_name, time, latitude, longitude, location_name, location_id,
  # count, week_no, location_code, region_name
  columns:
    - scientific_name
    - time
    - latitude
    - longitude
    - location_name
    - location_id
    - count
    - week_no
  taxa:
    dinophysis:
      name_contains: ["Dinophysis"]
      threshold_cells_l: 100.0
      threshold_mode: fixed
    pseudo_nitzschia:
      name_contains: ["Pseudo-nitzschia"]
      threshold_cells_l: 50000.0
      threshold_mode: fixed
    karenia_mikimotoi:
      name_contains: ["Karenia mikimotoi"]
      threshold_mode: positive_percentile
      percentile: 95
      # Fallback if too few positives in training data
      threshold_cells_l: 1000.0

biotoxin:
  erddap_base: https://erddap3.marine.ie/erddap
  # Verified 2026-09-01 via info.json
  pivot_dataset_id: habs_biotoxin_pivot
  long_dataset_id: habs_biotoxin
  status_dataset_id: habs_status

sst:
  # Default remains NOAA OISST. Set provider: ostia (or pass --provider ostia) for CMEMS.
  provider: ncdcOisst21Agg
  # Public NOAA OISST v2.1 daily, no Copernicus login.
  erddap_base: https://coastwatch.pfeg.noaa.gov/erddap
  dataset_id: ncdcOisst21Agg
  variable: sst
  anomaly_variable: anom
  zlev: 0.0
  # OISST longitudes are 0–360. Irish −11…−5 maps to 349…355.
  lon_convention: 0_360
  # Copernicus OSTIA L4 reprocessed (~0.05°). Verified 2026-09-01 via describe:
  # product SST_GLO_SST_L4_REP_OBSERVATIONS_010_011 /
  # dataset METOFFICE-GLO-SST-L4-REP-OBS-SST (analysed_sst, Kelvin; axis ~1981-10-01..2026-03-31).
  # Uses ~/.copernicusmarine credentials (never commit). Station-pixel extract preferred.
  copernicus_ostia:
    enabled: true
    product: SST_GLO_SST_L4_REP_OBSERVATIONS_010_011
    dataset_id: METOFFICE-GLO-SST-L4-REP-OBS-SST
    variable: analysed_sst
    service: timeseries
    kelvin_to_celsius: true
    t1_cap: "2026-03-31"

mhw:
  method: hobday_2016
  min_duration_days: 5
  max_gap_days: 2
  percentile: 90
  climatology_doy_window: 11

features:
  lags_days: [0, 7, 14, 21]
  rolling_days: [7, 14, 30]
  include_week_fourier: true
  include_lonlat: true

labels:
  # nowcast: exceedance in [week_start, week_start + 14d]
  # ahead_7d: exceedance in [week_start + 7d, week_start + 14d] using features known at week_start
  horizons:
    nowcast_days: [0, 14]
    ahead_7d_days: [7, 14]

splits:
  train: [2003, 2018]
  val: [2019, 2021]
  test_from: 2022

paths:
  raw_hab: data/raw/habs_phyto.csv
  raw_biotoxin_pivot: data/raw/habs_biotoxin_pivot.csv
  raw_biotoxin: data/raw/habs_biotoxin.csv
  raw_hab_status: data/raw/habs_status.csv
  toxin_panel: data/processed/toxin_station_week_panel.parquet
  status_panel: data/processed/status_area_week_panel.parquet
  toxin_joined: data/processed/toxin_joined_features.parquet
  raw_sst: data/raw/oisst_daily.parquet
  raw_sst_ostia: data/raw/ostia_daily.parquet
  mhw_ostia: data/processed/mhw_daily_ostia.parquet
  joined_ostia: data/processed/joined_features_ostia.parquet
  metrics_ostia: data/processed/metrics_dino_ostia.json
  panel: data/processed/station_week_panel.parquet
  mhw: data/processed/mhw_daily.parquet
  joined: data/processed/joined_features.parquet
  models_dir: data/models
  metrics: data/processed/metrics.json
  smc_phyto_panel: data/processed/smc_station_week_panel.parquet
  smc_toxin_panel: data/processed/smc_toxin_station_week_panel.parquet
  smc_areas: data/processed/smc_areas.csv
  raw_ibi: data/raw/ibi_daily.parquet
  mhw_enriched: data/processed/mhw_daily_enriched.parquet
  joined_ibi: data/processed/joined_features_ibi.parquet
  metrics_ibi: data/processed/metrics_dino_ibi.json
  ibi_report: data/processed/ibi_light_mhw_report.md
  raw_era5_stations: data/raw/era5_wind_stations.parquet
  joined_era5: data/processed/joined_features_era5.parquet
  local_sites_report: data/processed/local_sites_report.md
  local_sites_summary: data/processed/local_sites_summary.json
  raw_sentinel_dir: data/raw/sentinel

# IBI multi-year physics + BGC optics (Copernicus). Station-pixel extracts preferred.
ibi:
  service: timeseries
  t0: "2002-01-01"
  t1: "2026-05-19"
  product_phy: IBI_MULTIYEAR_PHY_005_002
  product_bgc: IBI_MULTIYEAR_BGC_005_003

# ERA5 10 m wind (CDS daily statistics). Credentials: ~/.cdsapirc (never commit).
era5:
  # Prefer archived hourly (4× daily → local daily mean). Yearly Irish bbox fits CDS cost limits.
  # Fallback: derived-era5-single-levels-daily-statistics in half-year chunks (see download_era5_chunk).
  dataset: reanalysis-era5-single-levels
  mode: hourly4_daily
  t0: "2002-01-01"
  t1: "2026-08-25"
  variables:
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
  include_msl: false
  times: ["00:00", "06:00", "12:00", "18:00"]
  # CDS area = [N, W, S, E]
  area: [56.0, -11.0, 51.0, -5.0]

# Connemara sentinel buoys (Marine Institute ERDDAP, verified 2026-09-01).
sentinel:
  erddap_base: https://erddap.marine.ie/erddap
  mace_head:
    dataset_id: compass_mace_head
    qc_dataset_id: sbe37_macehead
    lat: 53.3306
    lon: -9.9326
  lehanagh:
    dataset_id: sentinel_lehanagh
    lat: 53.4001
    lon: -9.8207
